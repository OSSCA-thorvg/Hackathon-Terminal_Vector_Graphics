<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TermVG — Terminal Vector Graphics Demo</title>
  <meta name="description" content="브라우저에서 ThorVG WASM으로 Lottie/SVG를 터미널 렌더링합니다." />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
  <script src="termvg-browser.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #0d1117; overflow: hidden; }
    #terminal-container { width: 100%; height: 100%; }
    #terminal-container .xterm { height: 100%; }
  </style>
</head>
<body>
  <div id="terminal-container"></div>
  <script>
    // ── Config ──
    const SAMPLES = [
      { name: 'Fireworks',       file: 'assets/5317-fireworkds.json', type: 'lottie' },
      { name: 'Loading Spinner', file: 'assets/43391.json',          type: 'lottie' },
      { name: 'Animation',       file: 'assets/week02-example01.json', type: 'lottie' },
      { name: 'SVG Graphic 1',   file: 'assets/1528966158.svg',      type: 'svg' },
      { name: 'SVG Graphic 2',   file: 'assets/2961.svg',            type: 'svg' },
      { name: 'ThorVG Logo',     file: 'assets/421553147-22eaf24a-a9a7-4a35-abac-df5a54ac5b19.svg', type: 'svg' },
    ];
    const MODES = ['half-block', 'quadrant', 'braille'];
    const MODE_LABELS = ['Half-block', 'Quadrant', 'Braille'];
    const MODE_PIXEL = [
      (w, h) => ({ pw: w, ph: h * 2 }),
      (w, h) => ({ pw: w * 2, ph: h * 2 }),
      (w, h) => ({ pw: w * 2, ph: h * 4 }),
    ];
    const TARGET_FPS = 30;
    const FRAME_MS = 1000 / TARGET_FPS;

    // ── State ──
    let term, fitAddon, engine;
    let wasmReady = false;
    let selectedIdx = 0;
    let modeIdx = 1; // quadrant
    let invertDark = false;
    let paused = false;
    let currentFrame = 0, totalFrames = 1, duration = 0;
    let animId = null, lastTime = 0;
    let fpsCount = 0, fpsValue = 0, fpsTimer = null;
    let prevAnsi = '';
    let fileLoaded = false;
    let fileContent = null; // cached content of currently loaded file

    // ── Box-Drawing Chars ──
    const BOX = { tl: '┌', tr: '┐', bl: '└', br: '┘', h: '─', v: '│' };

    // ── Terminal Init ──
    function initTerminal() {
      term = new window.Terminal({
        fontFamily: "'JetBrains Mono', 'Menlo', 'DejaVu Sans Mono', monospace",
        fontSize: 14, lineHeight: 1.0,
        theme: {
          background: '#0d1117', foreground: '#e6edf3', cursor: '#0d1117',
          black: '#484f58', red: '#ff7b72', green: '#3fb950', yellow: '#d29922',
          blue: '#58a6ff', magenta: '#bc8cff', cyan: '#39d353', white: '#b1bac4',
          brightBlack: '#6e7681', brightRed: '#ffa198', brightGreen: '#56d364',
          brightYellow: '#e3b341', brightBlue: '#79c0ff', brightMagenta: '#d2a8ff',
          brightCyan: '#56d364', brightWhite: '#f0f6fc',
        },
        cursorBlink: false, disableStdin: true, convertEol: true,
      });
      fitAddon = new window.FitAddon.FitAddon();
      term.loadAddon(fitAddon);
      term.open(document.getElementById('terminal-container'));
      fitAddon.fit();

      window.addEventListener('resize', () => {
        fitAddon.fit();
        if (fileLoaded) reloadAndRender();
        else drawUI();
      });

      document.addEventListener('keydown', handleKey);
    }

    // ── ANSI Helpers ──
    const CSI = '\x1b[';
    const moveTo = (r, c) => `${CSI}${r};${c}H`;
    const RESET = `${CSI}0m`;
    const BOLD = `${CSI}1m`;
    const DIM = `${CSI}2m`;
    const FG = (c) => `${CSI}${c}m`;
    const CYAN = FG(36);
    const GREEN = FG(32);
    const YELLOW = FG(33);
    const RED = FG(31);
    const WHITE = FG(37);
    const GRAY = FG(90);
    const MAGENTA = FG(35);
    const BG_BLUE = `${CSI}44m`;
    const HIDE_CURSOR = `${CSI}?25l`;
    const CLEAR = `${CSI}2J${CSI}H`;

    function padRight(s, len) {
      // Handle ANSI escape codes when calculating visible length
      const visible = s.replace(/\x1b\[[0-9;]*m/g, '');
      const pad = Math.max(0, len - visible.length);
      return s + ' '.repeat(pad);
    }

    function truncate(s, len) {
      if (s.length <= len) return s;
      return s.substring(0, len - 1) + '…';
    }

    // ── Draw Full UI ──
    function drawUI() {
      const rows = term.rows;
      const cols = term.cols;
      const leftW = Math.floor(cols * 0.30);
      const rightW = cols - leftW;

      let buf = CLEAR + HIDE_CURSOR;

      // ── Row 1: Header ──
      buf += moveTo(1, 1);
      buf += `${BOLD}${CYAN}🚀 termvg - ThorVG Terminal Player${RESET}`;
      buf += moveTo(1, cols - 18);
      buf += `${GRAY}[Browser WASM Demo]${RESET}`;

      // ── Left Panel: File List ──
      const listStartRow = 2;
      const listEndRow = rows - 2;
      const listHeight = listEndRow - listStartRow - 1;

      // Top border
      buf += moveTo(listStartRow, 1);
      buf += `${GRAY}${BOX.tl}${BOX.h.repeat(leftW - 2)}${BOX.tr}${RESET}`;

      // File items
      for (let i = 0; i < listHeight; i++) {
        const row = listStartRow + 1 + i;
        buf += moveTo(row, 1);
        buf += `${GRAY}${BOX.v}${RESET}`;

        if (i < SAMPLES.length) {
          const s = SAMPLES[i];
          const icon = s.type === 'lottie' ? '📄' : '🖼️';
          const label = `${icon} ${s.name}`;
          const isSelected = i === selectedIdx;

          if (isSelected) {
            buf += `${BG_BLUE}${BOLD}${WHITE}`;
            buf += padRight(` ${truncate(label, leftW - 4)} `, leftW - 2);
            buf += RESET;
          } else {
            buf += padRight(` ${truncate(label, leftW - 4)} `, leftW - 2);
          }
        } else {
          buf += ' '.repeat(leftW - 2);
        }

        buf += `${GRAY}${BOX.v}${RESET}`;
      }

      // Status line inside left panel
      buf += moveTo(listEndRow - 1, 1);
      buf += `${GRAY}${BOX.v}${RESET}`;
      const pageInfo = `${GRAY} ${SAMPLES.length} files${RESET}`;
      buf += padRight(pageInfo, leftW - 2);
      buf += `${GRAY}${BOX.v}${RESET}`;

      // Bottom border
      buf += moveTo(listEndRow, 1);
      buf += `${GRAY}${BOX.bl}${BOX.h.repeat(leftW - 2)}${BOX.br}${RESET}`;

      // ── Right Panel: Preview ──
      // Top border
      buf += moveTo(listStartRow, leftW + 1);
      buf += `${GRAY}${BOX.tl}${BOX.h.repeat(rightW - 2)}${BOX.tr}${RESET}`;

      // Header row
      buf += moveTo(listStartRow + 1, leftW + 1);
      buf += `${GRAY}${BOX.v}${RESET}`;

      const playIcon = paused ? `${RED}⏸ PAUSED` : `${GREEN}▶`;
      const previewTitle = `${BOLD}${YELLOW} Live Preview ${playIcon}${RESET}`;

      if (fileLoaded) {
        const frame = Math.floor(currentFrame);
        const fpsColor = fpsValue >= 25 ? GREEN : fpsValue >= 15 ? YELLOW : RED;
        const fpsText = `${frame}/${totalFrames} ${fpsColor}${BOLD}${fpsValue}fps${RESET}`;
        buf += previewTitle;
        // Right-align fps
        const titleVisible = ` Live Preview ${paused ? '⏸ PAUSED' : '▶'}`.length;
        const fpsVisible = `${frame}/${totalFrames} ${fpsValue}fps`.length;
        const gap = Math.max(1, rightW - 4 - titleVisible - fpsVisible);
        buf += ' '.repeat(gap) + fpsText;
      } else {
        buf += previewTitle;
      }

      buf += moveTo(listStartRow + 1, leftW + rightW);
      buf += `${GRAY}${BOX.v}${RESET}`;

      // Preview body (empty if no file)
      for (let i = 2; i < listEndRow - listStartRow; i++) {
        const row = listStartRow + i;
        buf += moveTo(row, leftW + 1);
        buf += `${GRAY}${BOX.v}${RESET}`;

        if (!fileLoaded && i === Math.floor((listEndRow - listStartRow) / 2)) {
          const msg = 'Select a file to preview';
          const pad = Math.floor((rightW - 2 - msg.length) / 2);
          buf += ' '.repeat(pad) + `${GRAY}${msg}${RESET}`;
          buf += ' '.repeat(Math.max(0, rightW - 2 - pad - msg.length));
        } else if (!fileLoaded) {
          buf += ' '.repeat(rightW - 2);
        }
        // If file is loaded, animation frames will overwrite this area

        buf += moveTo(row, leftW + rightW);
        buf += `${GRAY}${BOX.v}${RESET}`;
      }

      // Bottom border
      buf += moveTo(listEndRow, leftW + 1);
      buf += `${GRAY}${BOX.bl}${BOX.h.repeat(rightW - 2)}${BOX.br}${RESET}`;

      // ── Bottom Bar: Mode + Shortcuts ──
      buf += moveTo(rows - 1, 1);
      const modeLabel = MODE_LABELS[modeIdx];
      const darkLabel = invertDark ? '🌙Dark' : '☀️Light';
      buf += `${GRAY} Mode:${RESET}${CYAN}${modeLabel}${RESET}`;
      buf += `${GRAY} │ ${darkLabel}${RESET}`;
      buf += `${GRAY} │ ${RESET}${CYAN}Space${GRAY}:⏯ ${CYAN}M${GRAY}:Mode ${CYAN}D${GRAY}:Dark ${CYAN}←→${GRAY}:Seek${RESET}`;

      buf += moveTo(rows, 1);
      buf += `${GRAY} ↑↓:Select  Enter:Load  ${RESET}`;

      term.write(buf);
    }

    // ── Draw Animation Frame into Preview Area ──
    function renderAnimFrame() {
      if (!engine || !fileLoaded) return;

      const rows = term.rows;
      const cols = term.cols;
      const leftW = Math.floor(cols * 0.30);
      const rightW = cols - leftW;
      const previewW = rightW - 2;
      const previewStartRow = 4; // after header + preview title
      const previewEndRow = rows - 2;
      const previewH = previewEndRow - previewStartRow;

      if (previewW < 4 || previewH < 4) return;

      const ansi = engine.renderToString(currentFrame, modeIdx, invertDark);
      if (!ansi) return;

      // Only update if content changed
      if (ansi === prevAnsi && !paused) {
        // still update FPS counter in header
        updatePreviewHeader();
        return;
      }
      prevAnsi = ansi;

      const lines = ansi.split('\n');
      let buf = '';

      for (let i = 0; i < previewH; i++) {
        const row = previewStartRow + i;
        buf += moveTo(row, leftW + 2);
        if (i < lines.length) {
          // Write line, truncated to previewW
          const line = lines[i] || '';
          buf += line;
        }
      }

      // Update header with FPS
      updatePreviewHeader(buf);

      fpsCount++;
    }

    function updatePreviewHeader(extraBuf) {
      const cols = term.cols;
      const leftW = Math.floor(cols * 0.30);
      const rightW = cols - leftW;
      const listStartRow = 2;

      let buf = extraBuf || '';

      buf += moveTo(listStartRow + 1, leftW + 1);
      buf += `${GRAY}${BOX.v}${RESET}`;

      const playIcon = paused ? `${RED}⏸ PAUSED` : `${GREEN}▶`;
      buf += `${BOLD}${YELLOW} Live Preview ${playIcon}${RESET}`;

      const frame = Math.floor(currentFrame);
      const fpsColor = fpsValue >= 25 ? GREEN : fpsValue >= 15 ? YELLOW : RED;
      const fpsText = `${frame}/${totalFrames} ${fpsColor}${BOLD}${fpsValue}fps${RESET}`;

      const titleVisible = ` Live Preview ${paused ? '⏸ PAUSED' : '▶'}`.length;
      const fpsVisible = `${frame}/${totalFrames} ${fpsValue}fps`.length;
      const gap = Math.max(1, rightW - 4 - titleVisible - fpsVisible);
      buf += ' '.repeat(gap) + fpsText;

      buf += moveTo(listStartRow + 1, leftW + rightW);
      buf += `${GRAY}${BOX.v}${RESET}`;

      // Bottom bar update
      const rows = term.rows;
      buf += moveTo(rows - 1, 1);
      const modeLabel = MODE_LABELS[modeIdx];
      const darkLabel = invertDark ? '🌙Dark' : '☀️Light';
      buf += `${GRAY} Mode:${RESET}${CYAN}${modeLabel}${RESET}`;
      buf += `${GRAY} │ ${darkLabel}${RESET}`;
      buf += `${GRAY} │ ${RESET}${CYAN}Space${GRAY}:⏯ ${CYAN}M${GRAY}:Mode ${CYAN}D${GRAY}:Dark ${CYAN}←→${GRAY}:Seek${RESET}`;
      buf += '          '; // Clear trailing chars

      term.write(buf);
    }

    // ── Load File ──
    async function loadSelectedFile() {
      if (!wasmReady) return;
      const sample = SAMPLES[selectedIdx];

      stopAnimation();
      fileLoaded = false;
      drawUI();

      // Show loading
      const leftW = Math.floor(term.cols * 0.30);
      const midRow = Math.floor(term.rows / 2);
      term.write(moveTo(midRow, leftW + 4) + `${YELLOW}⏳ Loading ${sample.name}...${RESET}`);

      try {
        const res = await fetch(sample.file);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        fileContent = await res.text();

        setupEngine();

        fileLoaded = true;
        paused = false;
        currentFrame = 0;
        prevAnsi = '';

        if (fpsTimer) clearInterval(fpsTimer);
        fpsTimer = setInterval(() => { fpsValue = fpsCount; fpsCount = 0; }, 1000);

        drawUI(); // Redraw with file loaded state
        startAnimation();
      } catch (e) {
        term.write(moveTo(midRow + 1, leftW + 4) + `${RED}❌ Error: ${e.message}${RESET}`);
      }
    }

    function setupEngine() {
      const cols = term.cols;
      const leftW = Math.floor(cols * 0.30);
      const rightW = cols - leftW;
      const previewW = rightW - 2;
      const previewH = term.rows - 6;

      const { pw, ph } = MODE_PIXEL[modeIdx](previewW, previewH);
      engine.setSize(pw, ph);

      const loadRes = engine.load(fileContent);
      if (loadRes !== 0) throw new Error(`Load failed (code: ${loadRes})`);

      totalFrames = Math.max(1, engine.getTotalFrames());
      duration = engine.getDuration();
    }

    function reloadAndRender() {
      if (!fileLoaded || !fileContent) return;
      try {
        setupEngine();
        drawUI();
        renderAnimFrame();
      } catch (e) { /* ignore resize errors */ }
    }

    // ── Animation Loop ──
    function startAnimation() {
      if (animId) return;
      lastTime = performance.now();
      animId = requestAnimationFrame(tick);
    }

    function stopAnimation() {
      if (animId) { cancelAnimationFrame(animId); animId = null; }
      if (fpsTimer) { clearInterval(fpsTimer); fpsTimer = null; }
      fpsValue = 0;
    }

    function tick(now) {
      animId = requestAnimationFrame(tick);
      if (now - lastTime < FRAME_MS) return;
      lastTime = now - ((now - lastTime) % FRAME_MS);

      if (!paused && duration > 0) {
        currentFrame += totalFrames / (duration * TARGET_FPS);
        if (currentFrame >= totalFrames) currentFrame = 0;
      }

      renderAnimFrame();
    }

    // ── Keyboard ──
    function handleKey(e) {
      const key = e.key;

      if (key === 'ArrowUp') {
        e.preventDefault();
        selectedIdx = Math.max(0, selectedIdx - 1);
        drawUI();
        if (fileLoaded) renderAnimFrame();
        return;
      }
      if (key === 'ArrowDown') {
        e.preventDefault();
        selectedIdx = Math.min(SAMPLES.length - 1, selectedIdx + 1);
        drawUI();
        if (fileLoaded) renderAnimFrame();
        return;
      }
      if (key === 'Enter') {
        e.preventDefault();
        loadSelectedFile();
        return;
      }
      if (key === ' ' || e.code === 'Space') {
        e.preventDefault();
        if (!fileLoaded) return;
        paused = !paused;
        updatePreviewHeader();
        return;
      }
      if (key.toLowerCase() === 'm') {
        modeIdx = (modeIdx + 1) % MODES.length;
        if (fileLoaded) reloadAndRender();
        else drawUI();
        return;
      }
      if (key.toLowerCase() === 'd') {
        invertDark = !invertDark;
        if (fileLoaded && paused) renderAnimFrame();
        drawUI();
        if (fileLoaded) renderAnimFrame();
        return;
      }
      if (key === 'ArrowLeft' && paused && fileLoaded) {
        e.preventDefault();
        currentFrame = Math.max(0, currentFrame - totalFrames / TARGET_FPS);
        renderAnimFrame();
        return;
      }
      if (key === 'ArrowRight' && paused && fileLoaded) {
        e.preventDefault();
        currentFrame = Math.min(totalFrames - 1, currentFrame + totalFrames / TARGET_FPS);
        renderAnimFrame();
        return;
      }
    }

    // ── WASM Init ──
    async function initWasm() {
      try {
        const Module = await window.createTermVG({
          locateFile: (path) => path.endsWith('.wasm') ? 'termvg.wasm' : path,
        });
        engine = new Module.TermVGEngine();
        engine.init();
        wasmReady = true;
        drawUI();
      } catch (e) {
        term.write(CLEAR + `${RED}❌ WASM 로드 실패: ${e.message}${RESET}`);
        console.error(e);
      }
    }

    // ── Start ──
    document.addEventListener('DOMContentLoaded', async () => {
      initTerminal();
      term.write(CLEAR + HIDE_CURSOR);
      term.write(`${CYAN}${BOLD}🚀 TermVG${RESET} — ${GRAY}WASM 엔진 로딩 중...${RESET}`);
      await initWasm();
    });
  </script>
</body>
</html>
